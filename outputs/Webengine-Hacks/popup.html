<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WASM Memory Inspector</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">DEV TOOL</p>
          <h1>WASM Memory</h1>
        </div>
        <span id="statusDot" class="status-dot" title="Status"></span>
      </header>

      <p id="message" class="message">Conectando à página…</p>

      <button id="overlay" class="overlay-launch">Abrir painel móvel na página</button>

      <section class="panel">
        <label for="memory">Memória</label>
        <select id="memory" disabled>
          <option>Nenhuma memória encontrada</option>
        </select>

        <div class="row">
          <div>
            <label for="type">Tipo</label>
            <select id="type">
              <option value="all">All / Todos</option>
              <option value="integer">Integers / Inteiros</option>
              <option value="float">Float</option>
            </select>
          </div>
          <div>
            <label for="value">Valor</label>
            <input id="value" type="text" inputmode="decimal" placeholder="Ex.: 100">
          </div>
        </div>

        <div class="actions">
          <button id="scan" class="primary" disabled>First Scan</button>
          <button id="next" disabled>Next Scan</button>
          <button id="reset" class="ghost" disabled>Limpar</button>
        </div>
      </section>

      <section class="results-head">
        <strong>Resultados</strong>
        <span id="count">0</span>
      </section>
      <div id="results" class="results">
        <div class="empty">Os endereços encontrados aparecem aqui.</div>
      </div>
      <button id="refresh" class="refresh" disabled>Atualizar valores</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
